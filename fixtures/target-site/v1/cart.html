<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — ShopLite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">ShopLite</a>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/checkout">Checkout</a>
      <a href="/cart">Cart</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Your cart</h1>

    <div class="cart-layout">
      <div class="panel">
        <table class="cart-table">
          <thead>
            <tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr>
          </thead>
          <tbody data-cart>
            <tr data-price="2499">
              <td>Wireless Headphones</td>
              <td><input class="qty" type="number" min="1" value="1" aria-label="Quantity: Wireless Headphones"></td>
              <td class="line-price">₹2,499</td>
              <td class="line-total">₹2,499</td>
            </tr>
            <tr data-price="1299">
              <td>USB-C Hub</td>
              <td><input class="qty" type="number" min="1" value="2" aria-label="Quantity: USB-C Hub"></td>
              <td class="line-price">₹1,299</td>
              <td class="line-total">₹2,598</td>
            </tr>
          </tbody>
        </table>
      </div>

      <aside class="panel" aria-label="Order summary">
        <h2 style="margin-top:0;font-size:17px;">Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span data-subtotal>₹5,097</span></div>
        <div class="summary-row"><span>Shipping</span><span data-shipping>₹99</span></div>
        <div class="summary-row summary-row--total"><span>Total</span><span data-grand>₹5,196</span></div>
        <div class="cart-actions">
          <button class="btn btn-primary" type="button" id="checkout-btn">Proceed to checkout</button>
          <a class="continue" href="/">Continue shopping</a>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">© 2025 ShopLite — demo shop for PATCHWORK</footer>
  <script src="/app.js"></script>
</body>
</html>
