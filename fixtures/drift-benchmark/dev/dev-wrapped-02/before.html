<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Cart</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
.promo h3{margin:0 0 12px;font-size:16px}
.coupon-apply{border:1px solid #2f6f4f;background:#fff;color:#2f6f4f;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>Your cart</h1>
<div class="card promo">
<h3>Have a coupon?</h3>
<button class="coupon-apply" type="button">Apply coupon</button>
</div>
</div>
</body>
</html>
