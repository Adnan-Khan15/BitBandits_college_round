<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Cart</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
.coupon{margin-top:16px;display:flex;gap:8px;align-items:center;font-size:14px}
.coupon-label{font-weight:600}
.coupon-input{border:1px solid #ccd2d9;border-radius:6px;padding:8px 10px;font-size:14px}
.button{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer;background:#fff;border:1px dashed #2f6f4f;color:#2f6f4f}
.button--ghost{background:#fff;border:1px dashed #2f6f4f;color:#2f6f4f}
</style>
</head>
<body>
<div class="wrap">
<h1>Your cart</h1>
<div class="card">
<p>2 items — ₹1,798</p>
<div class="coupon">
<label class="coupon-label" for="coupon-code">Coupon code</label>
<input id="coupon-code" class="coupon-input" type="text" placeholder="Enter code">
<button id="coupon-submit" class="button button--ghost" type="button">Apply coupon</button>
</div>
</div>
</div>
</body>
</html>
