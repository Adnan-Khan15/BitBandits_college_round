<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Product</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:20px}
.buy-box{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
.price{margin:0;font-weight:600;font-size:22px}
.price-old{margin:0 0 12px;color:#888;text-decoration:line-through;font-size:14px}
.btn{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer;background:#2f6f4f;color:#fff}
.stock{font-size:13px;color:#2f6f4f}
</style>
</head>
<body>
<div class="wrap">
<h1>Wireless Mouse</h1>
<div class="buy-box">
<span class="price">₹1,299</span>
<span class="price-old">₹1,599</span>
<button class="btn" type="button">Add to cart</button>
<p class="stock">In stock</p>
</div>
</div>
</body>
</html>
