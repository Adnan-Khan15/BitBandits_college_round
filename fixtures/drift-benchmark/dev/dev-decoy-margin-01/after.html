<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Cart</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 4px;border-bottom:1px solid #eef1f4}
.cart-bar{margin-top:16px;display:flex;gap:8px;justify-content:flex-end}
.button{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer}
.button--primary{background:#2f6f4f;color:#fff}
.button--secondary{background:#fff;border:1px solid #2f6f4f;color:#2f6f4f}
</style>
</head>
<body>
<div class="wrap">
<h1>Your cart</h1>
<div class="card">
<table>
<tr><td>Wireless Mouse</td><td>₹1,299</td></tr>
<tr><td>USB-C Cable</td><td>₹499</td></tr>
</table>
<footer class="cart-bar">
<button class="button button--secondary" type="button">Save cart for later</button>
<button id="cta-checkout" class="button button--primary" type="button">Proceed to checkout</button>
</footer>
</div>
</div>
</body>
</html>
