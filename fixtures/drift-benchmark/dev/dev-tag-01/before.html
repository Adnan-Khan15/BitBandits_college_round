<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Product</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
.product-actions{display:flex;gap:8px}
.btn{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer;background:#2f6f4f;color:#fff}
.btn-outline{background:#fff;border:1px solid #2f6f4f;color:#2f6f4f}
</style>
</head>
<body>
<div class="wrap">
<h1>Wireless Mouse</h1>
<div class="card">
<p>₹1,299</p>
<div class="product-actions">
<button class="btn" type="button">Add to cart</button>
<button id="save-cart" class="btn btn-outline" type="button">Save cart</button>
</div>
</div>
</div>
</body>
</html>
