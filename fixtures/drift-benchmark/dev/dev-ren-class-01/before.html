<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Product</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:20px}
.listing{display:flex;gap:16px;align-items:flex-start}
.product-card{flex:1;background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
.product-desc{font-size:14px;color:#444}
.price{font-weight:600;font-size:18px}
.btn{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn-primary{background:#2f6f4f;color:#fff}
.listing-side{width:200px;background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
.mini-list{list-style:none;margin:0;padding:0;font-size:14px}
.mini-link{color:#2f6f4f;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Wireless Mouse</h1>
<section class="listing">
<article class="product-card">
<h2>Wireless Mouse</h2>
<p class="product-desc">Ergonomic 2.4 GHz mouse with silent clicks.</p>
<p class="price">₹1,299</p>
<button class="btn btn-primary" type="button">Add to cart</button>
</article>
<aside class="listing-side">
<h3>Recently viewed</h3>
<ul class="mini-list">
<li><a class="mini-link" href="/keyboard">Keyboard</a></li>
<li><a class="mini-link" href="/mousepad">Mousepad</a></li>
</ul>
</aside>
</section>
</div>
</body>
</html>
