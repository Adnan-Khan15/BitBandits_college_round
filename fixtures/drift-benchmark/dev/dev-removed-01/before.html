<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Home</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:20px}
.promo-banner{background:#fff4ce;border:1px solid #f0d264;border-radius:6px;padding:10px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
.product-card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px;font-size:14px}
.price{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<div class="promo-banner">Diwali sale — ends 31 Oct 2026</div>
<h1>Deals of the week</h1>
<section class="grid">
<article class="product-card"><h2>Wireless Mouse</h2><p class="price">₹1,299</p></article>
<article class="product-card"><h2>USB-C Cable</h2><p class="price">₹499</p></article>
</section>
</div>
</body>
</html>
