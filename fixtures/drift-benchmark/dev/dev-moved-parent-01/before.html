<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Cart</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding:24px}
h1{font-size:20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 4px;border-bottom:1px solid #eef1f4}
.cart-summary{margin-top:12px;display:flex;justify-content:flex-end}
.btn{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer}
.btn-primary{background:#2f6f4f;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>Your cart</h1>
<div class="card">
<table>
<tr><td>Wireless Mouse</td><td>₹1,299</td></tr>
<tr><td>USB-C Cable</td><td>₹499</td></tr>
</table>
<div class="cart-summary"><button id="checkout-btn" class="btn btn-primary" type="button">Proceed to checkout</button></div>
</div>
</div>
</body>
</html>
