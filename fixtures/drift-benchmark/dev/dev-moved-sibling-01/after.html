<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — Search results</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:20px}
.product{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.product-title{margin:0;font-size:18px}
.product-desc{margin:0;font-size:14px;color:#444}
.price{font-weight:600;font-size:18px}
.add-to-cart{border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer;background:#2f6f4f;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>Search results</h1>
<div class="product">
<h2 class="product-title">Wireless Mouse</h2>
<p class="product-desc">Ergonomic 2.4 GHz mouse with silent clicks.</p>
<button class="add-to-cart" type="button">Add to cart</button>
<span class="price">₹1,299</span>
</div>
</div>
</body>
</html>
