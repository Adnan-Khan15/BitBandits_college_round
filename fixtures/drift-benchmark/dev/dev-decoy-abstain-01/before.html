<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopLite — category listing</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1a1a}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:20px}
.product-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.product-item{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px;font-size:14px}
.add-to-cart{margin-top:8px;border:0;border-radius:6px;padding:10px 16px;font-size:14px;cursor:pointer;background:#2f6f4f;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>Mice</h1>
<ul class="product-list">
<li class="product-item"><h3>Wireless Mouse</h3><p>₹1,299</p><button class="add-to-cart" data-sku="m1" type="button">Add to cart</button></li>
<li class="product-item"><h3>Keyboard</h3><p>₹2,199</p><button class="add-to-cart" data-sku="k1" type="button">Add to cart</button></li>
</ul>
</div>
</body>
</html>
