<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monsoon essentials — Crafters Supply</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Crafters Supply</a>
    <nav class="site-nav">
      <a href="/">Shop</a>
      <a href="/cart">Cart</a>
      <a href="/help">Help</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Monsoon essentials</h1>

    <section class="product-grid" aria-label="Products">
      <article class="product-card" data-sku="MS1">
        <div class="product-card__media">
          <span class="badge">SALE</span>
        </div>
        <h2 class="product-card__name">Rain Shell</h2>
        <p class="product-card__price">₹2,199</p>
        <p class="product-card__desc">Taped seams, packs to a fist.</p>
        <div class="product-card__actions">
          <button class="button button--primary add-to-cart" type="button">Add to cart</button>
        </div>
      </article>

      <article class="product-card" data-sku="MS2">
        <div class="product-card__media"></div>
        <h2 class="product-card__name">Quick-Dry Towel</h2>
        <p class="product-card__price">₹749</p>
        <p class="product-card__desc">Antimicrobial, packs small.</p>
        <div class="product-card__actions">
          <button class="button button--primary add-to-cart" type="button">Add to cart</button>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">© 2026 Crafters Supply</footer>
</body>
</html>
