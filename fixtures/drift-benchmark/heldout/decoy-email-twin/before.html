<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account settings — Northwind Ops</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Northwind Ops</a>
    <nav class="topnav">
      <a class="topnav__link" href="/">Overview</a>
      <a class="topnav__link" href="/settings">Settings</a>
    </nav>
  </header>

  <main class="container container--narrow">
    <h1 class="page-title">Account settings</h1>

    <form class="panel" id="account-form" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="field__input" id="email" name="email" type="email" placeholder="Email address">
      </div>
      <div class="field">
        <label class="field__label" for="display-name">Display name</label>
        <input class="field__input" id="display-name" name="displayName" type="text">
      </div>
      <div class="form-actions">
        <button class="button button--primary" id="save-account" type="submit">Save changes</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">© 2026 Northwind Ops</footer>
</body>
</html>
