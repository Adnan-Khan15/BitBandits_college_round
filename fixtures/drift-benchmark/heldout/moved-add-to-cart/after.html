<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk setup — Crafters Supply</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">Crafters Supply</a>
    <nav class="site-nav">
      <a href="/">Shop</a>
      <a href="/cart">Cart</a>
      <a href="/help">Help</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Desk setup</h1>
    <p class="page-subtitle">Everything for a workspace that stays tidy.</p>

    <section class="product-grid" aria-label="Products">
      <article class="product-card" data-sku="DK1">
        <h2 class="product-card__name">Desk Mat XL</h2>
        <p class="product-card__price">₹899</p>
        <p class="product-card__desc">Stitched edges, water resistant.</p>
        <div class="product-card__actions">
          <button class="button button--primary add-to-cart" type="button">Add to cart</button>
        </div>
      </article>

      <article class="product-card" data-sku="DK2">
        <h2 class="product-card__name">Monitor Riser</h2>
        <p class="product-card__price">₹1,499</p>
        <p class="product-card__desc">Solid oak, 12 cm lift.</p>
        <div class="product-card__actions">
          <button class="button button--primary add-to-cart" type="button">Add to cart</button>
        </div>
      </article>

      <article class="product-card" data-sku="DK3">
        <h2 class="product-card__name">Cable Tray</h2>
        <p class="product-card__price">₹649</p>
        <div class="product-card__body">
          <p class="product-card__desc">Clamps to any desk edge.</p>
        </div>
        <div class="product-card__footer">
          <button class="button button--primary add-to-cart add-to-cart--hero" type="button">Add to cart</button>
          <span class="product-card__note">Free shipping</span>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">© 2026 Crafters Supply</footer>
</body>
</html>
